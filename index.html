<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LeetCode Tracker</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { background: #f5f5f5; }
    .problems { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>LeetCode Friend Tracker</h1>
  <table>
    <thead>
      <tr>
        <th>User</th>
        <th>Total Solved</th>
        <th>Solved Today</th>
        <th>Problems Today</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const REPO_RAW_URL = "https://raw.githubusercontent.com/Sam-5023/leetcode-tracker/main/records.json";

    fetch(REPO_RAW_URL + "?t=" + Date.now())
      .then(res => res.json())
      .then(data => {
        const today = new Date().toISOString().slice(0, 10);
        const tbody = document.getElementById("rows");

        Object.entries(data).forEach(([user, dates]) => {
          const todayData = dates[today] || {};
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${user}</td>
            <td>${todayData.total_solved ?? "-"}</td>
            <td>${todayData.count_today ?? 0}</td>
            <td class="problems">${(todayData.problems_today || []).join(", ") || "-"}</td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(err => {
        document.getElementById("rows").innerHTML = "<tr><td colspan='4'>Failed to load data</td></tr>";
        console.error(err);
      });
  </script>
</body>
</html>
